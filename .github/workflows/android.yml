name: VYRA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VYRA-Android-4.2-Privacy-Labels.zip
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  build:
    name: Build VYRA APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract VYRA source
        run: |
          set -e
          unzip -q VYRA-Android-4.2-Privacy-Labels.zip -d source
          test -f source/VYRA/settings.gradle
          test -f source/VYRA/app/build.gradle

      - name: Build and test APK
        run: |
          cd source/VYRA
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Android-APK
          path: source/VYRA/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
